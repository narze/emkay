name: Scrape

# Scraping is disabled: points are set manually in scraper/data.json.
# To re-enable, restore the push/schedule triggers and remove `if: false` below.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: false
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./scraper

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ./scraper

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Playwright
        run: npx playwright@1.62.0 install

      - name: Scrape
        env:
          MK_USERNAME: ${{ secrets.MK_USERNAME }}
          MK_PASSWORD: ${{ secrets.MK_PASSWORD }}
        run: ruby main.rb

      - name: Commit and push
        run: |
          git diff
          git config --global user.email "notbarze@users.noreply.github.com"
          git config --global user.name "narze's bot"
          git add data.json
          git add history.ndjson
          git commit -m "Update data" || exit 0
          git push
