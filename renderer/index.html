<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/mk-one-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MKONE</title>

    <!-- PWA meta tags -->
    <meta
      name="description"
      content="View your MKONE membership card, tier points, and privileges."
    />
    <meta name="theme-color" content="#ffffff" />
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS specific tags -->
    <link rel="apple-touch-icon" href="/icons/mkone-512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MKONE" />

    <meta name="msapplication-TileColor" content="#ffffff" />
    <meta name="msapplication-TileImage" content="/icons/mkone-192.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>

    <!-- Service Worker Registration -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", async () => {
          try {
            const registration = await navigator.serviceWorker.register(
              "/sw.js",
              {
                scope: "/",
              }
            )
            console.log(
              "Service Worker registered successfully with scope:",
              registration.scope
            )
          } catch (error) {
            console.error("Service Worker registration failed:", error)
          }
        })
      }
    </script>
  </body>
</html>
